services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mosaic}
      POSTGRES_USER: ${DB_USER:-mosaic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mosaic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mosaic} -d ${DB_NAME:-mosaic}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_USER: ${DB_USER:-mosaic}
      DB_PASSWORD: ${DB_PASSWORD:-mosaic}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mosaic}
      BACKEND_CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me-use-a-longer-local-secret-key}
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@mosaic.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
